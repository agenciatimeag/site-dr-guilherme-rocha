<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Obrigado | Dr. Guilherme Rocha</title>
<meta name="description" content="Recebemos o seu contato. Em breve a equipe do Instituto Guilherme Rocha falará com você para agendar a sua consulta.">
<meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#14170F">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
body{margin:0;background:#14170F}
.ty{min-height:100svh;display:grid;place-items:center;padding:32px var(--gut);box-sizing:border-box;color:#F4F5F0;background:radial-gradient(60% 50% at 50% 30%,rgba(199,171,107,.18),transparent 70%),#14170F;text-align:center}
.ty-in{display:grid;justify-items:center;gap:22px;max-width:560px}
.ty-logo img{height:44px;width:auto}
.ty-check{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:rgba(199,171,107,.14);border:1px solid rgba(199,171,107,.45);color:#E9D7A8}
.ty-check svg{width:32px;height:32px}
.ty h1{font:500 clamp(2.4rem,7vw,3.6rem)/1 var(--display);letter-spacing:-.04em;margin:0;color:#fff}
.ty h1 .it{color:#C7AB6B}
.ty p{margin:0;font-size:clamp(1.02rem,2.6vw,1.18rem);line-height:1.55;color:rgba(244,245,240,.78)}
.ty small{color:rgba(244,245,240,.5);font-size:.85rem}
.ty .btn{display:inline-flex}
</style>
</head><body>
<main class="ty">
  <div class="ty-in">
    <a class="ty-logo" href="/" aria-label="Dr. Guilherme Rocha, início"><img src="/logo-branco.png" alt="Dr. Guilherme Rocha" width="161" height="42"></a>
    <div class="ty-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>Obrigado<span class="it">!</span></h1>
    <p>Em breve nossa equipe entrará em contato para agendar a sua consulta.</p>
    <a class="btn btn-light" href="/">Voltar ao site<span class="ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 8h12M9 3l5 5-5 5"/></svg></span></a>
    <small>Instituto Guilherme Rocha · Guarapari (ES) · CRM-ES 11007</small>
  </div>
</main>
<script>
// conversão: evento LeadQualificado no Pixel (navegador) e na API de Conversões (servidor), com o mesmo ID para o Meta contar uma vez só
(function(){
  var ss={get:function(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
  var q=new URLSearchParams(location.search);
  if(ss.get('lq_sent')&&q.get('teste')!=='1')return; // não conta de novo se a pessoa recarregar a página
  var id='lq-'+Date.now()+'-'+Math.random().toString(36).slice(2,10);
  var d={}; try{d=JSON.parse(ss.get('lq_user')||'{}')}catch(e){}
  try{if(window.fbq)fbq('trackCustom','LeadQualificado',{},{eventID:id});}catch(e){}
  try{if(window.gtag)gtag('event','generate_lead',{page_path:'/obrigado'});}catch(e){}
  try{fetch('/api/capi',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},
    body:JSON.stringify({event_id:id,ph:d.ph,fn:d.fn,url:location.href,fbclid:q.get('fbclid')||undefined,test:q.get('teste')==='1'})});}catch(e){}
  ss.set('lq_sent','1');
})();
</script>
</body></html>
